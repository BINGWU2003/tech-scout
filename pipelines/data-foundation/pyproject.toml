[project]
name = "tech-scout-data-foundation"
version = "0.1.0"
description = "TechScout offline data-foundation pipeline"
requires-python = ">=3.13,<3.14"
dependencies = [
  "duckdb>=1.4.0,<2",
  "psycopg[binary]>=3.2,<4",
  "pytz>=2025.2",
  "pyyaml>=6,<7",
]

[project.scripts]
data-foundation = "data_foundation.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/data_foundation"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
