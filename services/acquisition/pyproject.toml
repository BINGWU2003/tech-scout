[project]
name = "tech-scout-acquisition"
version = "0.1.0"
description = "On-demand browser acquisition for Tech Scout"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi>=0.135,<1",
  "uvicorn>=0.41,<1",
  "playwright>=1.58,<2",
  "beautifulsoup4>=4.13,<5",
  "psycopg[binary,pool]>=3.3,<4",
  "pydantic-settings>=2.13,<3",
]

[project.scripts]
start = "tech_scout_acquisition.__main__:main"
acquisition = "tech_scout_acquisition.__main__:cli"

[dependency-groups]
dev = [
  "pytest>=8,<10",
  "pytest-asyncio>=1.3,<2",
  "ruff>=0.12,<1",
  "httpx>=0.28,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tech_scout_acquisition"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
