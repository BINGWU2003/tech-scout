[project]
name = "tech-scout-intelligence"
version = "0.1.0"
description = "TechScout online intelligence and agent service"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi>=0.135,<1",
  "httpx>=0.28,<1",
  "langgraph>=1.1,<2",
  "langgraph-checkpoint-postgres>=3,<4",
  "openai>=2.29,<3",
  "psycopg[binary,pool]>=3.3,<4",
  "pydantic>=2.12,<3",
  "pydantic-settings>=2.13,<3",
  "structlog>=25.5,<26",
  "uvicorn[standard]>=0.41,<1",
]

[dependency-groups]
dev = [
  "pytest>=8,<10",
  "pytest-asyncio>=1.3,<2",
  "respx>=0.22,<1",
  "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tech_scout_intelligence"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
